# ===============================================
# Configuración de FixIt Now - Spring Boot 3
# ===============================================
spring.application.name=FixIt Now

# Base de datos H2 en memoria para desarrollo
spring.datasource.url=jdbc:h2:mem:fixitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de datos SQL (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Puerto del servidor
server.port=8080
